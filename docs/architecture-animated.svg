<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420">
  <defs>
    <style>
      .box { fill:#0f172a; stroke:#38bdf8; stroke-width:2; rx:10; }
      .lbl { fill:#e2e8f0; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size:14px; }
      .sub { fill:#94a3b8; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size:11px; }
      .arr { fill:none; stroke:#fbbf24; stroke-width:2.5; marker-end:url(#arr); }
      .dot { fill:#fbbf24; }
      .pulse { animation: p 2.4s infinite; }
      @keyframes p { 0%{opacity:.25} 50%{opacity:1} 100%{opacity:.25} }
    </style>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#fbbf24"/>
    </marker>
  </defs>
  <rect width="760" height="420" fill="#020617"/>
  <text x="24" y="34" class="lbl" font-size="16">self-healing-pipeline · repair loop</text>

  <rect class="box" x="40" y="80" width="150" height="70"/>
  <text x="58" y="108" class="lbl">failing test</text>
  <text x="58" y="128" class="sub">pytest / traceback</text>

  <rect class="box" x="250" y="80" width="150" height="70"/>
  <text x="268" y="108" class="lbl">verifier</text>
  <text x="268" y="128" class="sub">classify failure</text>

  <rect class="box" x="460" y="80" width="150" height="70"/>
  <text x="478" y="108" class="lbl">LLM proposer</text>
  <text x="478" y="128" class="sub">unified diff</text>

  <rect class="box" x="670" y="80" width="60" height="70"/>
  <text x="682" y="108" class="lbl">patch</text>
  <text x="682" y="128" class="sub">apply</text>

  <rect class="box" x="460" y="230" width="150" height="70"/>
  <text x="478" y="258" class="lbl">sandbox</text>
  <text x="478" y="278" class="sub">subprocess + limits</text>

  <rect class="box" x="250" y="230" width="150" height="70"/>
  <text x="268" y="258" class="lbl">agent loop</text>
  <text x="268" y="278" class="sub">observe → propose → apply</text>

  <path class="arr pulse" d="M190 115 L250 115"/>
  <path class="arr pulse" d="M400 115 L460 115" style="animation-delay:.4s"/>
  <path class="arr pulse" d="M610 115 L670 115" style="animation-delay:.8s"/>
  <path class="arr pulse" d="M700 150 L700 230 L610 230" style="animation-delay:1.2s"/>
  <path class="arr pulse" d="M460 265 L400 265" style="animation-delay:1.6s"/>
  <path class="arr pulse" d="M250 265 L190 265 L190 150" style="animation-delay:2.0s"/>

  <circle class="dot pulse" cx="190" cy="115" r="4"/>
  <circle class="dot pulse" cx="400" cy="115" r="4" style="animation-delay:.4s"/>
  <circle class="dot pulse" cx="610" cy="115" r="4" style="animation-delay:.8s"/>
  <circle class="dot pulse" cx="700" cy="230" r="4" style="animation-delay:1.2s"/>
  <circle class="dot pulse" cx="400" cy="265" r="4" style="animation-delay:1.6s"/>
  <circle class="dot pulse" cx="190" cy="150" r="4" style="animation-delay:2.0s"/>

  <text x="24" y="400" class="sub">yellow dots travel the loop until the suite is green</text>
</svg>